<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安本纳尔国家位置</title>
<style>
body{margin:0;background:#172731;color:#f0eadc;font:16px system-ui,sans-serif}header,footer{padding:16px 24px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}a{color:#c5e1e6}select,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #6d8486;background:#243b44;color:#fff}h1{font-size:22px;margin:0}#stage{height:65vh;min-height:360px;position:relative;border-block:1px solid #506773}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#note{margin:0 0 8px}#details{color:#bacbd0;font-size:14px}footer p{max-width:1000px;line-height:1.7}#error{color:#ffd1a8}button{cursor:pointer}
